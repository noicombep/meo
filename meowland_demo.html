function reward(){const t=TASKS[rewardStage];return `<main class="shell reward-page"><div class="reward-content"><span class="section-label">MISSION COMPLETED!</span><span class="reward-icon">💗</span><h2>Em đã tìm thấy mảnh trái tim ${rewardStage+1}!</h2><p class="award-quote">“${escapeHtml(t.reward)}”</p><p>🐱 ${escapeHtml(CONFIG.catName)}: “Meow~ Giỏi quá! ${state.completed.length===5?'Giờ là lúc mở món quà anh đã chuẩn bị!':'Miu dẫn em tới nơi tiếp theo nhé!' }”</p>${btn(state.completed.length===5?'Mở rương quà →':'Tiếp tục cuộc phiêu lưu →',state.completed.length===5?'chest':'map')}</div></main>`}
function chest(){const s=state.giftStep;return `<main class="shell"><div class="mission-back">${btn('← Về bản đồ','map','btn secondary')}<span class="section-label">🎁 FINAL CHAPTER</span></div><section class="screen-title"><h2>Kho báu của chúng mình</h2><p>Em đã tìm thấy đủ 5 mảnh trái tim. Giờ hãy mở từng lớp quà mà ${escapeHtml(CONFIG.yourName.toLowerCase())} chuẩn bị nhé.</p></section><div class="gift-layout"><div class="gift-art"><span class="big-chest">${s===0?'🎁':s===1?'💌':s===2?'📸':'💝'}</span></div><div class="main-card gift-content"><span class="task-tag">${s===0?'Món quà cuối cùng':`Bí mật ${Math.min(s,3)} / 3`}</span>${s===0?`<h2>Chiếc rương đang đợi em</h2><p>Miu cất giấu 3 món quà nhỏ trong chiếc rương này. Hãy mở chúng lần lượt nhé.</p>${btn('🔑 Dùng chìa khóa vàng','gift-next')}`:s===1?`<h2>💌 Một bức thư dành cho em</h2><div class="gift-note">${escapeHtml(CONFIG.letter)}</div>${btn('Mở món quà thứ hai →','gift-next')}`:s===2?`<h2>📸 Những điều chúng mình nhớ</h2><p>Ba tấm thẻ kỷ niệm. Khi làm phiên bản thật, hãy thay chúng bằng ảnh của hai bạn.</p><div class="memory-grid">${CONFIG.memories.map((x,i)=>`<div><div class="memory-card">${['🥰','🌸','✨'][i]}</div><div style="font-size:11px;text-align:center;color:#aa7696;margin-top:9px">${escapeHtml(x)}</div></div>`).join('')}</div>${btn('Mở món quà cuối →','gift-next')}`:`<h2>🎟️ Voucher đặc biệt!</h2><p>Chiếc vé này chỉ có một người trên thế giới được sở hữu: ${escapeHtml(CONFIG.herName)}.</p><div class="coupon"><div style="font-size:13px;color:#b45b80;margin-bottom:12px">♡ SPECIAL LOVE TICKET ♡</div><strong>${escapeHtml(CONFIG.coupon)}</strong><div style="font-size:12px;color:#b78a9b;margin-top:17px">Không có hạn sử dụng · Một lần hoặc nhiều lần tùy em ♡</div></div><div class="notice">🐱 Miu: “Hết game rồi, nhưng cuộc phiêu lưu của hai người vẫn còn rất dài!”</div><div style="margin-top:17px">${btn('💗 Xem lại Meowland','map','btn secondary')}</div>`}</div></div></main>`}
function journal(){return `<div class="modal-back" data-action="close-journal"><div class="modal" role="dialog" aria-modal="true" aria-label="Nhật ký trái tim" onclick="event.stopPropagation()"><div class="modal-head"><h2>📖 Nhật ký trái tim</h2><button class="close" data-action="close-journal" aria-label="Đóng">×</button></div><p style="color:#9c748e">Những điều ${escapeHtml(CONFIG.catName)} gom lại trong chuyến đi:</p>${TASKS.map((t,i)=>`<div class="journal-item"><strong>${t.icon} ${escapeHtml(t.short)}</strong><br>${complete(i)?escapeHtml(t.reward):'🔒 Hoàn thành nhiệm vụ để mở lời nhắn này.'}</div>`).join('')}<p style="font-size:12px;color:#bb91a8;margin:16px 0 0">Dữ liệu tiến độ được lưu trên trình duyệt của thiết bị hiện tại.</p></div></div>`}
function render(){if(screen==='mission'&&!available(stage)){screen='map'}if(screen==='chest'&&state.completed.length<5){screen='map'}$('app').innerHTML=header()+(screen==='welcome'?welcome():screen==='map'?map():screen==='mission'?mission(stage):screen==='reward'?reward():chest())+footer()+(journalOpen?journal():'');save()}
function go(name){screen=name;window.scrollTo({top:0,behavior:'smooth'});render()}
function chime(){if(!state.soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;let ctx=new AC();[659,784,988].forEach((freq,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.00001,ctx.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.065,ctx.currentTime+i*.12+.02);g.gain.exponentialRampToValueAtTime(.00001,ctx.currentTime+i*.12+.25);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+i*.12);o.stop(ctx.currentTime+i*.12+.3)});setTimeout(()=>ctx.close(),900)}catch{}}
function celebrate(){chime();let pieces=['💗','✨','🌸','♡'];for(let n=0;n<14;n++){let el=document.createElement('span');el.className='confetti';el.textContent=pieces[n%pieces.length];el.style.left=(15+Math.random()*70)+'vw';el.style.top=(35+Math.random()*42)+'vh';el.style.animationDelay=(Math.random()*.23)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),1600)}}
function claim(){if(complete(stage))return;const ready=stage===0?state.feed===3:stage===1?state.found.length===3:stage===2?state.puzzle.every((v,k)=>v===k):stage===3?state.quiz===3:stage===4?state.stars.length===5:false;if(!ready)return;state.completed.push(stage);state.completed.sort((a,b)=>a-b);rewardStage=stage;celebrate();go('reward')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,i=Number(el.dataset.value||0);if(a==='welcome'){go('welcome')}else if(a==='start'||a==='map'){go('map')}else if(a==='next'){stage=Math.min(state.completed.length,4);go('mission')}else if(a==='mission'){let k=Number(el.dataset.stage);if(available(k)){stage=k;go('mission')}}else if(a==='chest'){if(state.completed.length===5)go('chest')}else if(a==='journal'){journalOpen=true;render()}else if(a==='close-journal'){journalOpen=false;render()}else if(a==='sound'){state.soundOn=!state.soundOn;chime();render()}else if(a==='feed'&&stage===0){if(state.feed<3){state.feed++;chime();render()}}else if(a==='find'&&stage===1){if(!state.found.includes(i)){state.found.push(i);chime();render()}}else if(a==='piece'&&stage===2){if(state.selected===null){state.selected=i}else if(state.selected===i){state.selected=null}else{let t=state.puzzle[state.selected];state.puzzle[state.selected]=state.puzzle[i];state.puzzle[i]=t;state.selected=null;chime()}render()}else if(a==='answer'&&stage===3){state.quizAnswer=i;chime();render()}else if(a==='quiz-next'&&stage===3){state.quiz++;state.quizAnswer=null;if(state.quiz===3)claim();else render()}else if(a==='star'&&stage===4){if(!state.stars.includes(i)){state.stars.push(i);chime();render()}}else if(a==='claim'){claim()}else if(a==='gift-next'){state.giftStep=Math.min(3,state.giftStep+1);chime();if(state.giftStep===3)celebrate();render()}else if(a==='reset'){if(confirm('Em có muốn bắt đầu cuộc phiêu lưu từ đầu không? Tiến độ cũ sẽ bị xóa.')){let keepSound=state.soundOn;state={...FRESH,completed:[],found:[],stars:[],puzzle:[2,0,3,1],soundOn:keepSound};go('welcome')}}});
document.addEventListener('dragstart',e=>{let b=e.target.closest('[data-action="feed"]');if(b){e.dataTransfer.setData('text/plain','fish');e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('#bowl'))e.preventDefault()});
document.addEventListener('drop',e=>{if(e.target.closest('#bowl')){e.preventDefault();if(e.dataTransfer.getData('text/plain')==='fish'&&state.feed<3){state.feed++;chime();render()}}});
render();
</script></body>
</html>
